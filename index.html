<script>
(function () {
  function formatRupiahValue(value) {
    const digits = String(value ?? '').replace(/\D/g, '');
    if (!digits) return '';
    return 'Rp' + Number(digits).toLocaleString('id-ID');
  }

  function attachPriceFormatter() {
    const candidates = Array.from(document.querySelectorAll(
      'input, textarea, [contenteditable="true"]'
    ));

    candidates.forEach(function (el) {
      if (el.dataset.rupiahFormatterAttached) return;

      const label = el.closest('.field')?.querySelector('label')?.textContent || '';
      const hint = (
        (el.getAttribute('name') || '') + ' ' +
        (el.getAttribute('id') || '') + ' ' +
        (el.getAttribute('placeholder') || '') + ' ' + label
      ).toLowerCase();

      if (!/(harga|price)/.test(hint)) return;

      el.dataset.rupiahFormatterAttached = '1';

      el.addEventListener('input', function () {
        const raw = this.value.replace(/\D/g, '');
        if (!raw) {
          this.value = '';
          return;
        }
        this.value = formatRupiahValue(raw);
        try { this.setSelectionRange(this.value.length, this.value.length); } catch(e) {}
      });

      el.addEventListener('blur', function () {
        const raw = this.value.replace(/\D/g, '');
        this.value = raw ? formatRupiahValue(raw) : '';
      });
    });
  }

  // Format harga yang sudah tampil di halaman tanpa mengubah harga yang sudah berformat.
  function formatDisplayedPrices() {
    document.querySelectorAll('.price').forEach(function (el) {
      const raw = el.textContent.trim();
      if (/^Rp\s?[\d.]+$/.test(raw)) return;
      const digits = raw.replace(/\D/g, '');
      if (digits) el.textContent = formatRupiahValue(digits);
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    attachPriceFormatter();
    formatDisplayedPrices();

    const observer = new MutationObserver(function () {
      attachPriceFormatter();
      formatDisplayedPrices();
    });
    observer.observe(document.body, { childList: true, subtree: true });
  });

  // Fungsi global supaya kode toko juga bisa memformat harga sebelum menyimpan.
  window.formatRupiah = formatRupiahValue;
})();
</script>

function dbRow(p){const row={id:p.id,name:p.name,price:p.price,category:p.category,type:p.type,description:p.description||'',image:p.image||'',link:p.link||'',clicks:Number(p.clicks||0),active:p.active!==false,featured:!!p.featured};if(p.createdAt)row.created_at=new Date(p.createdAt).toISOString();return row}
function fromDb(r){return {...r,createdAt:new Date(r.created_at).getTime()}}
async function loadProducts(){
  if(!SUPABASE_READY){return}
  const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});
  if(error){console.error(error); alert('Gagal memuat database Supabase: '+error.message); return}
  products=(data||[]).map(fromDb);
}
async function saveProductDb(p){
  const row=dbRow(p);
  const {data,error}=await sb.from('products').upsert(row).select().single();
  if(error) throw error; return fromDb(data);
}
async function deleteProductDb(id){const {error}=await sb.from('products').delete().eq('id',id);if(error)throw error}
async function incrementClickDb(id){
  const {data,error}=await sb.rpc('increment_product_click',{product_id:id});
  if(error) console.error(error);
}
async function ensureAdmin(){
  if(!SUPABASE_READY)return false;
  const {data}=await sb.auth.getSession(); currentUser=data.session?.user||null;
  if(!currentUser)return false;
  const {data:profile,error}=await sb.from('profiles').select('role').eq('id',currentUser.id).single();
  if(error||profile?.role!=='admin'){alert('Akun ini belum memiliki akses admin.'); await sb.auth.signOut(); currentUser=null; return false}
  return true;
}
async function logout(){if(sb) await sb.auth.signOut(); currentUser=null; showHome()}

function priceNumber(p){return Number(String(p.price||'').replace(/[^0-9]/g,''))||0}
function activeProducts(){return products.filter(p=>p.active)}
function showHome(pushHistory=false){
  category='All';query='';shopSort='featured';renderHome();
  if(pushHistory)history.pushState({view:'home'},'',location.pathname+location.search);
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderHome(){
document.getElementById('app').innerHTML=`<section class="hero"><div><div class="kicker">NEBO STORE / FASHION DISCOVERY</div><h1>FASHION,<br>CURATED.</h1></div><div><p class="hero-copy">Temukan pakaian, sepatu, dan aksesoris pilihan untuk pria dan wanita. Jelajahi koleksi pilihan, buka detail produk, lalu lanjutkan ke toko affiliate dengan satu klik.</p><button class="btn" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">EXPLORE PRODUCTS →</button></div></section>
<section class="section featured-section" id="featured"><div class="featured-head"><div><div class="featured-label">EDITOR'S PICKS</div><h2 style="margin-top:7px">Featured Products</h2></div><button class="view" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">VIEW ALL →</button></div><div class="featured-grid" id="featuredGrid"></div></section>
<section class="section" id="products"><div class="topline"><h2>Selected Finds</h2><div class="filters">${['All','Men','Women','Unisex'].map(c=>`<button class="filter ${category===c?'active':''}" onclick="setCategory('${c}')">${c.toUpperCase()}</button>`).join('')}</div></div>
<div class="controlbar"><input class="search" id="search" placeholder="Cari produk..." value="${escapeHtml(query)}" oninput="query=this.value;drawProducts()"><select onchange="shopSort=this.value;drawProducts()"><option value="featured" ${shopSort==='featured'?'selected':''}>Featured dulu</option><option value="newest" ${shopSort==='newest'?'selected':''}>Terbaru</option><option value="popular" ${shopSort==='popular'?'selected':''}>Paling populer</option><option value="priceLow" ${shopSort==='priceLow'?'selected':''}>Harga terendah</option><option value="priceHigh" ${shopSort==='priceHigh'?'selected':''}>Harga tertinggi</option><option value="name" ${shopSort==='name'?'selected':''}>Nama A–Z</option></select></div><div class="grid" id="productGrid"></div></section>
<footer><img src="${logo_uri}" alt="NEBO STORE"><p>NEBO STORE — curated fashion finds untuk pria & wanita. Pilih produk favoritmu dan lanjutkan ke toko affiliate pilihan.</p></footer>`;drawFeatured();drawProducts()}
function productCard(p,featured=false){
const photo=p.image?`<div class="pic" role="button" tabindex="0" aria-label="Lihat ${escapeAttr(p.name)}" onclick="navigateToProduct(${p.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();navigateToProduct(${p.id})}"><img src="${escapeAttr(p.image)}" alt="${escapeAttr(p.name)}" style="width:100%;height:100%;object-fit:cover"><span class="tag">${escapeHtml(p.category)}</span></div>`:`<div class="pic" role="button" tabindex="0" aria-label="Lihat ${escapeAttr(p.name)}" onclick="navigateToProduct(${p.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();navigateToProduct(${p.id})}"><span class="pictext">PRODUCT PHOTO</span><span class="tag">${escapeHtml(p.category)}</span></div>`;
return `<article class="card featured-card">${featured?'<span class="featured-badge">FEATURED</span>':''}${photo}<div class="info"><div class="type">${escapeHtml(p.type)}</div><h3>${escapeHtml(p.name)}</h3><div class="row"><span class="price">${escapeHtml(p.price)}</span><button class="view" onclick="navigateToProduct(${p.id})">VIEW PRODUCT ↗</button></div></div></article>`}
function drawFeatured(){const list=activeProducts().filter(p=>p.featured).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,4);document.getElementById('featuredGrid').innerHTML=list.length?list.map(p=>productCard(p,true)).join(''):'<p style="color:#777">Belum ada produk featured.</p>'}
function drawProducts(){let list=activeProducts().filter(p=>(category==='All'||p.category===category)&&(`${p.name} ${p.type} ${p.description}`.toLowerCase().includes(query.toLowerCase())));list.sort((a,b)=>{if(shopSort==='featured')return Number(b.featured)-Number(a.featured)||(b.createdAt||0)-(a.createdAt||0);if(shopSort==='popular')return (b.clicks||0)-(a.clicks||0);if(shopSort==='priceLow')return priceNumber(a)-priceNumber(b);if(shopSort==='priceHigh')return priceNumber(b)-priceNumber(a);if(shopSort==='name')return a.name.localeCompare(b.name);return (b.createdAt||0)-(a.createdAt||0)});document.getElementById('productGrid').innerHTML=list.length?list.map(p=>productCard(p)).join(''):'<p style="color:#777">Produk tidak ditemukan.</p>'}
function setCategory(c){category=c;renderHome();document.getElementById('products').scrollIntoView({behavior:'smooth'})}
function navigateToProduct(id){openProduct(id,true)}
function openProduct(id,pushHistory=true){
const p=products.find(x=>x.id===id);if(!p)return;
document.getElementById('app').innerHTML=`<section class="section"><button class="view detail-back" onclick="goBackFromProduct()">← BACK TO SHOP</button><div class="detail" style="margin-top:30px"><div class="detail-photo" role="button" tabindex="0" aria-label="Buka foto ${escapeAttr(p.name)}" onclick="openLightbox(${p.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openLightbox(${p.id})}">${p.image?`<img src="${escapeAttr(p.image)}" alt="${escapeAttr(p.name)}" style="width:100%;height:100%;object-fit:cover">`:'PRODUCT PHOTO'}</div><div><div class="eyebrow">${escapeHtml(p.category)} / ${escapeHtml(p.type)}</div><h1>${escapeHtml(p.name)}</h1><strong style="font-size:22px">${escapeHtml(p.price)}</strong><div class="product-meta"><span class="product-chip">NEBO STORE</span><span class="product-chip">${escapeHtml(p.category)}</span><span class="product-chip">${escapeHtml(p.type)}</span></div><p class="desc">${escapeHtml(p.description)}</p><button class="btn" onclick="affiliateClick(${p.id})">VIEW PRODUCT ↗</button><div class="click-note">Klik tombol di atas untuk menuju toko affiliate secara langsung.</div></div></div></section>`;
if(pushHistory)history.pushState({view:'product',id:id},'',location.pathname+'#product-'+id);
window.scrollTo({top:0,behavior:'smooth'});
}
function goBackFromProduct(){if(history.state?.view==='product')history.back();else showHome(false)}
function openLightbox(id){const p=products.find(x=>x.id===id);if(!p||!p.image)return;const lb=document.getElementById('lightbox'),im=document.getElementById('lightboxImg');im.src=p.image;im.alt=p.name;lb.classList.add('show');lb.setAttribute('aria-hidden','false');document.body.style.overflow=''}
function closeLightbox(){const lb=document.getElementById('lightbox');if(lb){lb.classList.remove('show');lb.setAttribute('aria-hidden','true');document.body.style.overflow=''}}
function handlePopState(e){closeLightbox();if(e.state?.view==='product'&&e.state.id!=null)openProduct(e.state.id,false);else{history.replaceState({view:'home'},'',location.pathname+location.search);showHome(false)}}
async function affiliateClick(id){
const p=products.find(x=>x.id===id);if(!p)return;p.clicks=(p.clicks||0)+1;
if(SUPABASE_READY)await incrementClickDb(id);else save();
if(p.link&&!p.link.includes('example.com'))window.open(p.link,'_blank','noopener');else alert('Demo link. Ganti link affiliate produk ini melalui ADMIN.');
}
async function showLogin(){
 document.getElementById('app').innerHTML=`<section class="section login-section"><div class="login-card"><div class="eyebrow">NEBO STORE / ADMIN</div><h2>ADMIN LOGIN</h2><p style="color:#777">Masuk menggunakan akun email Supabase yang sudah diberi role admin.</p><div class="field"><label>EMAIL</label><input id="login_email" type="email" placeholder="admin@email.com"></div><div class="field"><label>PASSWORD</label><input id="login_password" type="password" placeholder="••••••••"></div><button class="btn" onclick="loginAdmin()">LOGIN →</button><p id="login_msg" style="font-size:12px;color:#b33;margin-top:12px"></p></div></section>`
}
async function loginAdmin(){
 if(!SUPABASE_READY){document.getElementById('login_msg').textContent='Isi SUPABASE_URL dan SUPABASE_KEY terlebih dahulu di file HTML.';return}
 const email=val('login_email'),password=document.getElementById('login_password').value;
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error){document.getElementById('login_msg').textContent=error.message;return}
 if(await ensureAdmin()){await loadProducts();showAdmin()}
}
async function showAdmin(){
 if(!SUPABASE_READY){showLogin();return}
 if(!(await ensureAdmin())){showLogin();return}
 const list=adminProducts();const featuredCount=products.filter(p=>p.featured).length;const activeCount=products.filter(p=>p.active).length;const clicks=products.reduce((n,p)=>n+(p.clicks||0),0);
 document.getElementById('app').innerHTML=`<section class="section"><div class="topline"><div><div class="eyebrow">PRIVATE DASHBOARD</div><h2>NEBO STORE ADMIN</h2><p style="font-size:12px;color:#777">${escapeHtml(currentUser.email||'')}</p></div><div><button class="small" onclick="logout()">LOGOUT</button> <button class="btn" onclick="openAdd()">+ ADD PRODUCT</button></div></div><div class="stat-grid"><div class="stat"><small>TOTAL PRODUCTS</small><strong>${products.length}</strong></div><div class="stat"><small>ACTIVE</small><strong>${activeCount}</strong></div><div class="stat"><small>FEATURED</small><strong>${featuredCount}</strong></div><div class="stat"><small>TOTAL AFFILIATE CLICKS</small><strong>${clicks}</strong></div></div><div class="admin-toolbar"><input placeholder="Cari produk..." value="${escapeAttr(adminQuery)}" oninput="adminQuery=this.value;showAdmin()"><select onchange="adminCategory=this.value;showAdmin()"><option>All</option>${['Men','Women','Unisex'].map(c=>`<option ${adminCategory===c?'selected':''}>${c}</option>`).join('')}</select><select onchange="adminStatus=this.value;showAdmin()"><option>All</option><option ${adminStatus==='Active'?'selected':''}>Active</option><option ${adminStatus==='Inactive'?'selected':''}>Inactive</option><option ${adminStatus==='Featured'?'selected':''}>Featured</option></select><select onchange="adminSort=this.value;showAdmin()"><option value="newest" ${adminSort==='newest'?'selected':''}>Terbaru</option><option value="oldest" ${adminSort==='oldest'?'selected':''}>Terlama</option><option value="clicks" ${adminSort==='clicks'?'selected':''}>Klik terbanyak</option><option value="priceLow" ${adminSort==='priceLow'?'selected':''}>Harga terendah</option><option value="priceHigh" ${adminSort==='priceHigh'?'selected':''}>Harga tertinggi</option><option value="name" ${adminSort==='name'?'selected':''}>Nama A–Z</option></select></div><div style="overflow:auto"><table class="admin-table"><thead><tr><th>PRODUCT</th><th>CATEGORY</th><th>PRICE</th><th>CLICKS</th><th>STATUS</th><th>FEATURED</th><th>ACTION</th></tr></thead><tbody>${list.map(p=>`<tr><td><div class="admin-product">${p.image?`<img class="admin-thumb" src="${escapeAttr(p.image)}">`:''}<strong>${escapeHtml(p.name)}</strong></div></td><td>${escapeHtml(p.category)}</td><td>${escapeHtml(p.price)}</td><td>${p.clicks||0}</td><td><span class="${p.active?'badge-on':'badge-off'}">${p.active?'ON':'OFF'}</span></td><td>${p.featured?'YES':'NO'}</td><td><button class="small" onclick="openEdit(${p.id})">EDIT</button> <button class="small delete" onclick="deleteProduct(${p.id})">DELETE</button></td></tr>`).join('')}</tbody></table></div><p style="font-size:10px;color:#888;margin-top:25px">Database: Supabase • Auth: Supabase Auth • RLS aktif • TOTAL AFFILIATE CLICKS dihitung dari klik tombol affiliate.</p></section>`
}
function adminProducts(){let list=products.filter(p=>{const q=adminQuery.toLowerCase();const matchQ=`${p.name} ${p.type} ${p.description}`.toLowerCase().includes(q);const matchC=adminCategory==='All'||p.category===adminCategory;const matchS=adminStatus==='All'||(adminStatus==='Active'&&p.active)||(adminStatus==='Inactive'&&!p.active)||(adminStatus==='Featured'&&p.featured);return matchQ&&matchC&&matchS});list.sort((a,b)=>{if(adminSort==='clicks')return (b.clicks||0)-(a.clicks||0);if(adminSort==='priceLow')return priceNumber(a)-priceNumber(b);if(adminSort==='priceHigh')return priceNumber(b)-priceNumber(a);if(adminSort==='name')return a.name.localeCompare(b.name);if(adminSort==='oldest')return (a.createdAt||0)-(b.createdAt||0);return (b.createdAt||0)-(a.createdAt||0)});return list}
function openAdd(){openForm(null)}function openEdit(id){openForm(products.find(p=>p.id===id))}
function openForm(p){const x=p||{name:'',price:'',category:'Men',type:'T-Shirt',description:'',image:'',link:'',active:true,featured:false};document.getElementById('modal').innerHTML=`<div class="modal-head"><h2>${p?'EDIT':'ADD'} PRODUCT</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>PRODUCT NAME</label><input id="f_name" value="${escapeAttr(x.name)}"></div><div class="admin-grid"><div class="field"><label>PRICE</label><input id="f_price" placeholder="Rp89.000" value="${escapeAttr(x.price)}"></div><div class="field"><label>CATEGORY</label><select id="f_category">${['Men','Women','Unisex'].map(c=>`<option ${x.category===c?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="field"><label>TYPE</label><input id="f_type" placeholder="T-Shirt / Pants / Jacket / Shoes..." value="${escapeAttr(x.type)}"></div><div class="field"><label>PRODUCT IMAGE URL</label><input id="f_image" placeholder="https://..." value="${escapeAttr(x.image)}"></div><div class="field"><label>AFFILIATE LINK</label><input id="f_link" placeholder="Tempel link produk affiliate di sini" value="${escapeAttr(x.link)}"></div><div class="field"><label>DESCRIPTION</label><textarea id="f_desc">${escapeHtml(x.description)}</textarea></div><label class="featured-toggle"><input type="checkbox" id="f_featured" ${x.featured?'checked':''}> Jadikan Featured Product</label><label class="featured-toggle"><input type="checkbox" id="f_active" ${x.active?'checked':''}> Produk aktif / tampil di toko</label><button class="btn" onclick="saveForm(${p?p.id:'null'})">SAVE PRODUCT</button>`;document.getElementById('overlay').classList.add('show')}
async function saveForm(id){const data={name:val('f_name'),price:val('f_price'),category:val('f_category'),type:val('f_type'),image:val('f_image'),link:val('f_link'),description:val('f_desc'),active:document.getElementById('f_active').checked,featured:document.getElementById('f_featured').checked};if(!data.name||!data.link){alert('Nama produk dan link affiliate wajib diisi.');return}try{if(id===null){const p={id:Date.now(),...data,clicks:0,createdAt:Date.now()};if(SUPABASE_READY){const saved=await saveProductDb(p);products.unshift(saved)}else{products.unshift(p);save()}}else{const i=products.findIndex(p=>p.id===id);const p={...products[i],...data};if(SUPABASE_READY){const saved=await saveProductDb(p);products[i]=saved}else{products[i]=p;save()}}closeModal();showAdmin()}catch(e){alert('Gagal menyimpan: '+e.message)}}
async function deleteProduct(id){if(!confirm('Hapus produk ini?'))return;try{if(SUPABASE_READY)await deleteProductDb(id);products=products.filter(p=>p.id!==id);if(!SUPABASE_READY)save();showAdmin()}catch(e){alert('Gagal menghapus: '+e.message)}}
function closeModal(){document.getElementById('overlay').classList.remove('show')}function val(id){return document.getElementById(id).value.trim()}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function escapeAttr(s){return escapeHtml(s)}
async function boot(){
  if(SUPABASE_READY){
    await loadProducts();
    const {data}=await sb.auth.getSession(); currentUser=data.session?.user||null;
    sb.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null});
  }
  showHome();
}
boot();
</script>
<div id="lightbox" class="lightbox" aria-hidden="true"><button class="lightbox-close" aria-label="Tutup foto" onclick="closeLightbox()">×</button><img id="lightboxImg" alt=""></div>
<script>window.addEventListener('popstate',handlePopState);if(!history.state)history.replaceState({view:'home'},'',location.pathname+location.search);document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLightbox()});</script>
</body>
</html>
